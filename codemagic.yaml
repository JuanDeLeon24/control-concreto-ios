# Compila la app de iPhone y la sube a TestFlight para probarla.
# Antes de usarlo: cambia APP_STORE_APPLE_ID por el "Apple ID" numérico de la app en App Store Connect
# y crea en Codemagic la integración de App Store Connect con el nombre "CodemagicASC" (ver README).
workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.obra.controlconcreto
      vars:
        APP_STORE_APPLE_ID: 0000000000
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Crear el proyecto iOS
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Permisos, icono y ajustes de la app
        script: |
          PLIST=ios/App/App/Info.plist
          P=/usr/libexec/PlistBuddy
          poner() { $P -c "Delete :$1" "$PLIST" 2>/dev/null || true; $P -c "Add :$1 $2 $3" "$PLIST"; }
          poner NSCameraUsageDescription string "Para tomar la foto de la remisión de cada mixer."
          poner NSPhotoLibraryUsageDescription string "Para elegir la foto de la remisión o el logo de la empresa."
          poner NSPhotoLibraryAddUsageDescription string "Para guardar imágenes de las remisiones."
          poner ITSAppUsesNonExemptEncryption bool false
          poner CFBundleDisplayName string "Concreto"
          $P -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          $P -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          $P -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          cp recursos/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Firma (perfiles de App Store)
        script: xcode-project use-profiles
      - name: Número de compilación
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((ULTIMO + 1))
      - name: Compilar .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
